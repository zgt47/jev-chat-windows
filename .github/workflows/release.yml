name: release

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 写入版本号
        shell: pwsh
        run: |
          Set-Content -Path app/version.py -Value 'VERSION = "0.1.12"' -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 装依赖
        run: pip install -r requirements.txt pyinstaller

      - name: 打包
        run: pyinstaller --noconfirm --clean jev.spec

      - name: 压 zip
        id: pack
        shell: pwsh
        run: |
          $exe = 'dist\jev-chat-windows\jev-chat-windows.exe'
          if (-not (Test-Path $exe)) { throw "exe 没生成：$exe" }
          $zip = "jev-chat-windows-v0.1.12.zip"
          Copy-Item -Path LICENSE, NOTICE -Destination 'dist\jev-chat-windows'
          Compress-Archive -Path 'dist\jev-chat-windows' -DestinationPath $zip
          Add-Content -Path $env:GITHUB_OUTPUT -Value "zip=$zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: jev-chat-windows
          path: '*.zip'
          if-no-files-found: error

      - name: 发 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.12
          target_commitish: main
          files: ${{ steps.pack.outputs.zip }}
          body: ""
          generate_release_notes: false
